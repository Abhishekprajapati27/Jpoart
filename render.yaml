services:
  - type: web
    name: jport-portal
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir job job.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: jport-db
          property: connectionString

databases:
  - name: jport-db
    plan: free